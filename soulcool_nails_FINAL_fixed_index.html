<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Soulcool Nails 雲端記帳</title><style>:root{--bg:#f7f5f2;--card:#fff;--ink:#222;--muted:#777;--line:#e6e0d8;--accent:#3658d6;--good:#16835c;--bad:#cf4040}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}header{position:sticky;top:0;z-index:5;background:#111;color:#fff;padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:19px;margin:0}.status{font-size:12px;opacity:.8}nav{display:flex;gap:8px;overflow:auto}nav button{background:#2c2c2c;color:#fff;white-space:nowrap}nav button.active{background:#fff;color:#111}main{max-width:1200px;margin:auto;padding:16px}.page{display:none}.page.active{display:block}.card,.syncbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.syncbox{background:#eef3ff;border-color:#ccd8ff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#fafafa;border:1px solid var(--line);border-radius:14px;padding:13px}.metric small{color:var(--muted)}.metric b{display:block;font-size:22px;margin-top:4px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:16px}button{border:0;border-radius:11px;padding:11px 14px;font-weight:700}.primary{background:var(--accent);color:#fff}.good{background:var(--good);color:#fff}.ghost{background:#eee}.bad{background:#ffe8e8;color:var(--bad)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.help{font-size:12px;color:var(--muted);line-height:1.5}.tech-picker{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;border:1px solid var(--line);border-radius:11px;padding:9px}.tech-choice{display:flex;align-items:center;gap:7px;padding:7px 8px;background:#f7f5f2;border-radius:9px;margin:0;color:var(--ink);font-size:14px}.tech-choice input{width:auto;margin:0}.tech-split,.pay-split{grid-column:1/-1;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fafafa}.tech-split{display:none}.tech-split.active{display:block}.split-row{display:grid;grid-template-columns:1fr 105px 95px 105px 90px;gap:8px;align-items:center;margin-top:8px}.split-net{font-weight:800}.split-tip{font-weight:800;text-align:right}.pay-split{border-color:#d9e1ff;background:#f7f9ff}.pay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}.pay-total,.tip-preview{margin-top:8px;font-weight:800;color:var(--good)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted)}.day-slider{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px}.day-card{flex:0 0 min(92%,760px);scroll-snap-align:start;border:1px solid var(--line);border-radius:16px;padding:14px;background:#fafafa}.entry{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}.entry-top{display:flex;justify-content:space-between}.entry-tech,.entry-total{font-weight:800}.entry-meta{font-size:12px;color:var(--muted);line-height:1.5;margin-top:5px}.entry-tip{color:var(--accent);font-weight:800}.day-nav{display:flex;gap:10px;margin:8px 0 12px}.day-nav button{flex:1;background:#111;color:#fff}@media(max-width:800px){.grid,.metrics,.pay-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){header{align-items:flex-start;flex-direction:column}.grid,.metrics,.pay-grid{grid-template-columns:1fr}.actions button{flex:1}.split-row{grid-template-columns:1fr 1fr}.day-card{flex-basis:94%}}</style></head><body><header><div><h1>💅 Soulcool Nails 雲端記帳</h1><div id="cloudStatus" class="status">☁️ 尚未連線</div></div><nav><button class="active" data-page="daily">每日</button><button data-page="expense">支出</button><button data-page="report">月報</button><button data-page="settings">設定</button></nav></header><main><section id="daily" class="page active"><div class="syncbox"><b>Google Sheet 同步</b><div class="help">手機與 Mac 可共用同一份帳。</div><div class="actions"><button class="good" onclick="syncToCloud()">☁️ 同步到雲端</button><button class="ghost" onclick="loadFromCloud()">⬇️ 從雲端載入</button></div></div><div class="card"><h3>新增收入</h3><div class="grid"><div><label>日期</label><input id="iDate" type="date"></div><div><label>折扣 / 調整</label><input id="iAdjust" type="number" step="0.01"></div><div><label>備註</label><input id="iNote"></div><div><label>美甲師（可複選）</label><div id="iTech" class="tech-picker"><label class="tech-choice"><input type="checkbox" value="Kimi">Kimi</label><label class="tech-choice"><input type="checkbox" value="Raina">Raina</label><label class="tech-choice"><input type="checkbox" value="Zoey">Zoey</label><label class="tech-choice"><input type="checkbox" value="Tina">Tina</label><label class="tech-choice"><input type="checkbox" value="Charisse">Charisse</label><label class="tech-choice"><input type="checkbox" value="Betty">Betty</label><label class="tech-choice"><input type="checkbox" value="Eva">Eva</label><label class="tech-choice"><input type="checkbox" value="Cici">Cici</label><label class="tech-choice"><input type="checkbox" value="Tina (new)">Tina (new)</label></div></div><div id="techSplit" class="tech-split"><b>每位美甲師分配服務金額</b><div id="techSplitRows"></div><div id="tipPreview" class="tip-preview"></div></div><div class="pay-split"><b>付款方式（可混合付款）</b><div class="pay-grid"><div><label>Zelle</label><input id="pZelle" type="number"></div><div><label>Cash</label><input id="pCash" type="number"></div><div><label>Card</label><input id="pCard" type="number"></div><div><label>Gift Card</label><input id="pGift" type="number"></div><div><label>Kimi</label><input id="pKimi" type="number"></div><div><label>Siang</label><input id="pSiang" type="number"></div></div><div id="payCheck" class="pay-total"></div></div></div><div class="actions"><button class="primary" onclick="addIncome()">加入收入</button></div></div><div class="card"><h3>今日摘要</h3><div class="metrics"><div class="metric"><small>服務營收</small><b id="mRevenue">$0</b></div><div class="metric"><small>Tips</small><b id="mTips">$0</b></div><div class="metric"><small>總收入</small><b id="mTotal">$0</b></div><div class="metric"><small>支出</small><b id="mExpense">$0</b></div></div></div><div class="card"><h3>每日明細</h3><div id="dailyDetailSlider" class="day-slider"></div></div></section><section id="expense" class="page"><div class="card"><h3>新增支出</h3><div class="grid"><div><label>日期</label><input id="eDate" type="date"></div><div><label>金額</label><input id="eAmount" type="number"></div><div><label>分類</label><select id="eType"><option>材料</option><option>設備</option><option>房租</option><option>水電網路</option><option>稅務</option><option>薪資</option><option>其他</option></select></div><div><label>備註</label><input id="eNote"></div></div><button class="primary" onclick="addExpense()">加入支出</button><div class="tablewrap"><table><tbody id="expenseRows"></tbody></table></div></div></section><section id="report" class="page"><div class="card"><label>月份</label><input id="monthPicker" type="month"><div class="metrics"><div class="metric"><small>月營收</small><b id="rRevenue">$0</b></div><div class="metric"><small>月 Tips</small><b id="rTips">$0</b></div><div class="metric"><small>月支出</small><b id="rExpense">$0</b></div><div class="metric"><small>月營餘</small><b id="rProfit">$0</b></div></div></div></section><section id="settings" class="page"><div class="card"><h3>Google Apps Script 連線設定</h3><label>Apps Script Web App URL</label><input id="apiUrl"><div class="actions"><button class="primary" onclick="saveSettings()">儲存設定</button><button class="ghost" onclick="testConnection()">測試連線</button></div></div></section></main><script>
const IN='soulcool_income_cloud_v2',EX='soulcool_expense_cloud_v2',API='soulcool_api_url_v2';
const FIXED_API='https://script.google.com/macros/s/AKfycbyW3CPRYyGXYen2lWexTUQySVflMhx2jDs-M7ba9eUX5bGMvgS8VwkXPwv_Wj28Z4QY/exec';
let incomes=JSON.parse(localStorage.getItem(IN)||'[]'),expenses=JSON.parse(localStorage.getItem(EX)||'[]');
const $=s=>document.querySelector(s),num=v=>Number(v||0),money=n=>'$'+num(n).toFixed(2),today=()=>{const n=new Date(),y=n.getFullYear(),m=String(n.getMonth()+1).padStart(2,'0'),d=String(n.getDate()).padStart(2,'0');return `${y}-${m}-${d}`};
iDate.value=today();eDate.value=today();monthPicker.value=today().slice(0,7);apiUrl.value=FIXED_API;localStorage.setItem(API,FIXED_API);
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('#'+b.dataset.page).classList.add('active');render()});
function saveLocal(){localStorage.setItem(IN,JSON.stringify(incomes));localStorage.setItem(EX,JSON.stringify(expenses))}
function selectedTechs(){return[...document.querySelectorAll('#iTech input:checked')].map(x=>x.value)}
function currentParts(){return[...document.querySelectorAll('.tech-service-input')].map(el=>{const tech=el.dataset.tech,gross=num(el.value),discount=num(document.querySelector(`.tech-discount-input[data-tech="${tech}"]`)?.value);return{tech,gross,discount,amount:Math.max(0,gross-discount)}})}
function splitTips(totalTips,parts){const total=parts.reduce((s,p)=>s+p.amount,0),tips=Math.round(num(totalTips));if(!total)return parts.map(p=>({...p,tip:0}));return parts.map((p,i)=>({...p,tip:i===parts.length-1?tips-parts.slice(0,-1).reduce((s,q)=>s+Math.round(tips*q.amount/total),0):Math.round(tips*p.amount/total)}))}
function refreshTechSplit(){const techs=selectedTechs();if(!techs.length){techSplit.classList.remove('active');techSplitRows.innerHTML='';return refreshCalculations()}techSplit.classList.add('active');techSplitRows.innerHTML=techs.map(t=>`<div class="split-row"><b>${t}</b><input class="tech-service-input" data-tech="${t}" type="number" placeholder="服務金額"><input class="tech-discount-input" data-tech="${t}" type="number" placeholder="折扣"><span class="split-net" data-net-for="${t}"></span><span class="split-tip" data-tip-for="${t}"></span></div>`).join('');document.querySelectorAll('.tech-service-input,.tech-discount-input').forEach(el=>el.oninput=refreshCalculations);refreshCalculations()}
document.querySelectorAll('#iTech input').forEach(el=>el.onchange=refreshTechSplit);
function paymentParts(){return{Zelle:num(pZelle.value),Cash:num(pCash.value),Card:num(pCard.value),'Gift Card':num(pGift.value),Kimi:num(pKimi.value),Siang:num(pSiang.value)}}function paymentTotal(){return Object.values(paymentParts()).reduce((s,v)=>s+v,0)}function encodePay(p){return Object.entries(p).filter(([,v])=>v>0).map(([k,v])=>`${k}:${v.toFixed(2)}`).join('|')}
function refreshCalculations(){const parts=currentParts(),service=parts.reduce((s,p)=>s+p.amount,0),gross=parts.reduce((s,p)=>s+p.gross,0),paid=paymentTotal(),tips=Math.max(0,Math.round(paid-gross)),splits=splitTips(tips,parts);splits.forEach(p=>{const a=document.querySelector(`[data-net-for="${p.tech}"]`),b=document.querySelector(`[data-tip-for="${p.tech}"]`);if(a)a.textContent='實收 '+money(p.amount);if(b)b.textContent='Tip '+money(p.tip)});tipPreview.textContent='折扣後服務營收：'+money(service)+'｜總 Tips：'+money(tips);payCheck.textContent='付款總額：'+money(paid)}
[pZelle,pCash,pCard,pGift,pKimi,pSiang].forEach(el=>el.oninput=refreshCalculations);
function addIncome(){const techs=selectedTechs(),parts=currentParts(),service=parts.reduce((s,p)=>s+p.amount,0),gross=parts.reduce((s,p)=>s+p.gross,0),paid=paymentTotal(),adjust=num(iAdjust.value);if(!iDate.value||!techs.length)return alert('請選日期和美甲師');if(!service)return alert('請輸入服務金額');if(!paid)return alert('請輸入付款方式金額');const tips=Math.max(0,Math.round(paid-gross)),splits=splitTips(tips,parts);incomes.unshift({id:crypto.randomUUID(),date:iDate.value,tech:techs.join(' + '),techs,techSplits:splits,amount:service,tips,adjust,pay:encodePay(paymentParts()),paidTotal:paid,note:iNote.value.trim()});saveLocal();render();alert('已加入收入')}
function addExpense(){const amount=num(eAmount.value);if(!amount)return;expenses.unshift({id:crypto.randomUUID(),date:eDate.value,amount,type:eType.value,note:eNote.value});saveLocal();render()}
function render(){expenseRows.innerHTML=expenses.map(x=>`<tr><td>${x.date}</td><td>${x.type}</td><td>${money(x.amount)}</td><td>${x.note||''}</td></tr>`).join('');const d=today(),di=incomes.filter(x=>x.date===d),de=expenses.filter(x=>x.date===d);mRevenue.textContent=money(di.reduce((s,x)=>s+num(x.amount),0));mTips.textContent=money(di.reduce((s,x)=>s+num(x.tips),0));mTotal.textContent=money(di.reduce((s,x)=>s+num(x.paidTotal||x.amount+x.tips),0));mExpense.textContent=money(de.reduce((s,x)=>s+num(x.amount),0));const groups={};incomes.forEach(x=>(groups[x.date]??=[]).push(x));dailyDetailSlider.innerHTML=Object.keys(groups).sort().reverse().map(date=>`<div class="day-card"><b>${date}</b>${groups[date].map(x=>`<div class="entry"><div class="entry-top"><span class="entry-tech">${x.tech}</span><span class="entry-total">${money(x.paidTotal)}</span></div><div class="entry-meta">服務 ${money(x.amount)} · Tips ${money(x.tips)}<br>${x.pay||''}</div></div>`).join('')}</div>`).join('');const ym=monthPicker.value,mi=incomes.filter(x=>x.date.startsWith(ym)),me=expenses.filter(x=>x.date.startsWith(ym));rRevenue.textContent=money(mi.reduce((s,x)=>s+num(x.amount),0));rTips.textContent=money(mi.reduce((s,x)=>s+num(x.tips),0));rExpense.textContent=money(me.reduce((s,x)=>s+num(x.amount),0));rProfit.textContent=money(mi.reduce((s,x)=>s+num(x.amount),0)-me.reduce((s,x)=>s+num(x.amount),0))}
monthPicker.onchange=render;
function saveSettings(){apiUrl.value=FIXED_API;localStorage.setItem(API,FIXED_API);alert('已儲存正確的雲端連線')}
function getApi(){return FIXED_API}
async function testConnection(){try{const r=await fetch(FIXED_API+'?action=ping&_='+Date.now(),{cache:'no-store'}),j=await r.json();if(!j.ok)throw Error(j.error||'連線失敗');cloudStatus.textContent='☁️ Google Sheet 已連線';alert('連線成功！')}catch(e){alert('連線失敗：'+e.message)}}
async function syncToCloud(){try{cloudStatus.textContent='☁️ 同步中…';const r=await fetch(FIXED_API+'?v=6&t='+Date.now(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveAll',incomes:incomes,expenses:expenses}),cache:'no-store'});const text=await r.text();let j;try{j=JSON.parse(text)}catch(_){throw Error('雲端回傳格式錯誤')};if(!j.ok)throw Error(j.error||'同步失敗');cloudStatus.textContent='☁️ 已同步';alert(`已同步到 Google Sheet\n收入 ${j.incomeCount??incomes.length} 筆｜支出 ${j.expenseCount??expenses.length} 筆`)}catch(e){cloudStatus.textContent='☁️ 同步失敗';alert('同步失敗：'+e.message)}}
async function loadFromCloud(){try{const r=await fetch(FIXED_API+'?action=loadAll&_='+Date.now(),{cache:'no-store'}),j=await r.json();if(!j.ok)throw Error(j.error||'載入失敗');incomes=j.incomes||[];expenses=j.expenses||[];saveLocal();render();cloudStatus.textContent='☁️ 已載入';alert(`已從雲端載入\n收入 ${incomes.length} 筆｜支出 ${expenses.length} 筆`)}catch(e){alert('載入失敗：'+e.message)}}
render();refreshTechSplit();refreshCalculations();
</script></body></html>
