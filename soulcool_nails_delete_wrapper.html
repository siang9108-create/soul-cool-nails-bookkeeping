<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<title>Soulcool Nails 雲端記帳</title>
<style>html,body{margin:0;width:100%;height:100%;background:#f7f5f2}#app{border:0;width:100%;height:100vh;display:block}</style>
</head>
<body>
<iframe id="app" src="soulcool_nails_FINAL_fixed_index.html?v=20260815-customtech1"></iframe>
<script>
const IN='soulcool_income_cloud_v2';
const EX='soulcool_expense_cloud_v2';
const API='https://script.google.com/macros/s/AKfycbyW3CPRYyGXYen2lWexTUQySVflMhx2jDs-M7ba9eUX5bGMvgS8VwkXPwv_Wj28Z4QY/exec';
const app=document.getElementById('app');
function readJson(key){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return []}}
async function saveCloud(incomes,expenses){const r=await fetch(API+'?delete=1&t='+Date.now(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveAll',incomes,expenses}),cache:'no-store'});const j=await r.json();if(!j.ok)throw new Error(j.error||'同步失敗')}
async function deleteIncome(id,button){if(!confirm('確定要刪除這筆收入嗎？'))return;const oldIncomes=readJson(IN),expenses=readJson(EX),next=oldIncomes.filter(x=>String(x.id)!==String(id));if(next.length===oldIncomes.length){alert('找不到這筆資料，請先從雲端載入後再試。');return}button.disabled=true;button.textContent='刪除中…';localStorage.setItem(IN,JSON.stringify(next));try{await saveCloud(next,expenses);alert('已刪除並同步到 Google Sheet');app.contentWindow.location.reload()}catch(e){localStorage.setItem(IN,JSON.stringify(oldIncomes));button.disabled=false;button.textContent='刪除';alert('刪除同步失敗：'+e.message)}}
function installCustomTechInput(){let w,doc;try{w=app.contentWindow;doc=app.contentDocument||w.document}catch(e){return}if(!doc)return;const picker=doc.querySelector('#iTech');if(!picker||doc.querySelector('#customTechName'))return;picker.className='';picker.innerHTML='<input id="customTechName" type="text" autocomplete="off" placeholder="輸入美甲師姓名" style="width:100%">';const input=doc.querySelector('#customTechName');w.selectedTechs=function(){const name=(input.value||'').trim();return name?[name]:[]};w.refreshTechSplit=function(){const name=(input.value||'').trim(),box=doc.querySelector('#techSplit'),rows=doc.querySelector('#techSplitRows');if(!name){box.classList.remove('active');rows.innerHTML='';if(typeof w.refreshCalculations==='function')w.refreshCalculations();return}const oldService=doc.querySelector('.tech-service-input')?.value||'';const oldDiscount=doc.querySelector('.tech-discount-input')?.value||'';box.classList.add('active');rows.innerHTML=`<div class="split-row"><b>${name}</b><input class="tech-service-input" data-tech="${name.replace(/"/g,'&quot;')}" type="number" placeholder="服務金額" value="${oldService}"><input class="tech-discount-input" data-tech="${name.replace(/"/g,'&quot;')}" type="number" placeholder="折扣" value="${oldDiscount}"><span class="split-net" data-net-for="${name.replace(/"/g,'&quot;')}"></span><span class="split-tip" data-tip-for="${name.replace(/"/g,'&quot;')}"></span></div>`;doc.querySelectorAll('.tech-service-input,.tech-discount-input').forEach(el=>el.oninput=w.refreshCalculations);if(typeof w.refreshCalculations==='function')w.refreshCalculations()};input.addEventListener('input',()=>w.refreshTechSplit());input.addEventListener('change',()=>w.refreshTechSplit())}
function addDeleteButtons(){let doc;try{doc=app.contentDocument||app.contentWindow.document}catch(e){return}if(!doc)return;const incomes=readJson(IN);[...doc.querySelectorAll('.day-card')].forEach(card=>{const date=(card.querySelector('b')?.textContent||'').trim(),records=incomes.filter(x=>String(x.date)===date),entries=[...card.querySelectorAll('.entry')];entries.forEach((entry,i)=>{if(entry.querySelector('.mac-delete-btn'))return;const rec=records[i];if(!rec||!rec.id)return;const btn=doc.createElement('button');btn.className='bad mac-delete-btn';btn.textContent='刪除';btn.style.cssText='margin-top:10px;display:inline-block;padding:9px 14px;border-radius:10px;font-weight:700;cursor:pointer';btn.onclick=ev=>{ev.preventDefault();ev.stopPropagation();deleteIncome(rec.id,btn)};entry.appendChild(btn)})})}
app.addEventListener('load',()=>{installCustomTechInput();addDeleteButtons();try{const doc=app.contentDocument||app.contentWindow.document;const observer=new MutationObserver(()=>{installCustomTechInput();addDeleteButtons()});observer.observe(doc.documentElement,{childList:true,subtree:true});setTimeout(()=>{installCustomTechInput();addDeleteButtons()},300);setTimeout(()=>{installCustomTechInput();addDeleteButtons()},1000)}catch(e){}});
</script>
</body>
</html>
