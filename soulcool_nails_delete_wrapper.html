<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<title>Soulcool Nails 雲端記帳</title>
<style>html,body{margin:0;width:100%;height:100%;background:#f7f5f2}#app{border:0;width:100%;height:100vh;display:block}</style>
</head>
<body>
<iframe id="app" src="soulcool_nails_FINAL_fixed_index.html?v=20260815-shared-discount1"></iframe>
<script>
const IN='soulcool_income_cloud_v2';
const EX='soulcool_expense_cloud_v2';
const API='https://script.google.com/macros/s/AKfycbyW3CPRYyGXYen2lWexTUQySVflMhx2jDs-M7ba9eUX5bGMvgS8VwkXPwv_Wj28Z4QY/exec';
const app=document.getElementById('app');
function readJson(key){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return []}}
async function saveCloud(incomes,expenses){const r=await fetch(API+'?delete=1&t='+Date.now(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveAll',incomes,expenses}),cache:'no-store'});const j=await r.json();if(!j.ok)throw new Error(j.error||'同步失敗')}
async function deleteIncome(id,button){if(!confirm('確定要刪除這筆收入嗎？'))return;const oldIncomes=readJson(IN),expenses=readJson(EX),next=oldIncomes.filter(x=>String(x.id)!==String(id));if(next.length===oldIncomes.length){alert('找不到這筆資料，請先從雲端載入後再試。');return}button.disabled=true;button.textContent='刪除中…';localStorage.setItem(IN,JSON.stringify(next));try{await saveCloud(next,expenses);alert('已刪除並同步到 Google Sheet');app.contentWindow.location.reload()}catch(e){localStorage.setItem(IN,JSON.stringify(oldIncomes));button.disabled=false;button.textContent='刪除';alert('刪除同步失敗：'+e.message)}}
function installCustomTechInput(){let w,doc;try{w=app.contentWindow;doc=app.contentDocument||w.document}catch(e){return}if(!doc)return;const picker=doc.querySelector('#iTech');if(!picker||doc.querySelector('#customTechName1'))return;picker.className='tech-picker';picker.innerHTML=Array.from({length:10},(_,i)=>`<label class="tech-choice" style="display:flex;align-items:center;gap:7px"><input class="custom-tech-check" id="customTechCheck${i+1}" type="checkbox"><input class="custom-tech-name" id="customTechName${i+1}" type="text" autocomplete="off" placeholder="美甲師 ${i+1}" style="width:100%;padding:8px"></label>`).join('');
w.selectedTechs=function(){return [...doc.querySelectorAll('.custom-tech-check:checked')].map(cb=>{const n=cb.closest('.tech-choice').querySelector('.custom-tech-name');return (n.value||'').trim()}).filter(Boolean)};
w.currentParts=function(){const serviceEls=[...doc.querySelectorAll('.tech-service-input')];const grossValues=serviceEls.map(el=>({tech:el.dataset.tech,gross:Number(el.value||0)}));const totalGross=grossValues.reduce((s,p)=>s+p.gross,0);const shared=Math.max(0,Math.min(Number(doc.querySelector('#sharedTechDiscount')?.value||0),totalGross));let used=0;return grossValues.map((p,i)=>{let discount=0;if(totalGross>0&&shared>0){if(i===grossValues.length-1){discount=shared-used}else{discount=shared*(p.gross/totalGross);used+=discount}}return{tech:p.tech,gross:p.gross,discount,amount:Math.max(0,p.gross-discount)}})};
w.refreshTechSplit=function(){const names=w.selectedTechs(),box=doc.querySelector('#techSplit'),rows=doc.querySelector('#techSplitRows');const oldGross={};doc.querySelectorAll('.tech-service-input').forEach(el=>oldGross[el.dataset.tech]=el.value);const oldDiscount=doc.querySelector('#sharedTechDiscount')?.value||'';if(!names.length){box.classList.remove('active');rows.innerHTML='';if(typeof w.refreshCalculations==='function')w.refreshCalculations();return}box.classList.add('active');const discountHtml=`<div style="margin-top:10px;margin-bottom:12px"><label style="display:block;font-weight:700;margin-bottom:6px">折扣</label><input id="sharedTechDiscount" type="number" step="0.01" placeholder="折扣" value="${oldDiscount}" style="width:100%"></div>`;const techHtml=names.map(name=>{const safe=name.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');return `<div class="split-row"><b>${safe}</b><input class="tech-service-input" data-tech="${safe}" type="number" placeholder="服務金額" value="${oldGross[name]||''}"><span class="split-net" data-net-for="${safe}"></span><span class="split-tip" data-tip-for="${safe}"></span></div>`}).join('');rows.innerHTML=discountHtml+techHtml;doc.querySelectorAll('.tech-service-input,#sharedTechDiscount').forEach(el=>el.oninput=w.refreshCalculations);if(typeof w.refreshCalculations==='function')w.refreshCalculations()};
doc.querySelectorAll('.custom-tech-check,.custom-tech-name').forEach(el=>{el.addEventListener('input',()=>w.refreshTechSplit());el.addEventListener('change',()=>w.refreshTechSplit())})}
function installCustomPaymentNames(){let w,doc;try{w=app.contentWindow;doc=app.contentDocument||w.document}catch(e){return}if(!doc||doc.querySelector('#customPayName1'))return;const kimi=doc.querySelector('#pKimi'),siang=doc.querySelector('#pSiang');if(!kimi||!siang)return;const kimiBox=kimi.parentElement,siangBox=siang.parentElement;kimiBox.querySelector('label').innerHTML='<input id="customPayName1" type="text" placeholder="輸入付款名稱" style="padding:5px 7px;font-size:12px">';siangBox.querySelector('label').innerHTML='<input id="customPayName2" type="text" placeholder="輸入付款名稱" style="padding:5px 7px;font-size:12px">';const n1=doc.querySelector('#customPayName1'),n2=doc.querySelector('#customPayName2');w.paymentParts=function(){const obj={Zelle:Number(doc.querySelector('#pZelle')?.value||0),Cash:Number(doc.querySelector('#pCash')?.value||0),Card:Number(doc.querySelector('#pCard')?.value||0),'Gift Card':Number(doc.querySelector('#pGift')?.value||0)};const name1=(n1.value||'').trim(),name2=(n2.value||'').trim(),v1=Number(kimi.value||0),v2=Number(siang.value||0);if(name1)obj[name1]=(obj[name1]||0)+v1;if(name2)obj[name2]=(obj[name2]||0)+v2;return obj};[n1,n2].forEach(el=>el.addEventListener('input',()=>{if(typeof w.refreshCalculations==='function')w.refreshCalculations()}));}
function addDeleteButtons(){let doc;try{doc=app.contentDocument||app.contentWindow.document}catch(e){return}if(!doc)return;const incomes=readJson(IN);[...doc.querySelectorAll('.day-card')].forEach(card=>{const date=(card.querySelector('b')?.textContent||'').trim(),records=incomes.filter(x=>String(x.date)===date),entries=[...card.querySelectorAll('.entry')];entries.forEach((entry,i)=>{if(entry.querySelector('.mac-delete-btn'))return;const rec=records[i];if(!rec||!rec.id)return;const btn=doc.createElement('button');btn.className='bad mac-delete-btn';btn.textContent='刪除';btn.style.cssText='margin-top:10px;display:inline-block;padding:9px 14px;border-radius:10px;font-weight:700;cursor:pointer';btn.onclick=ev=>{ev.preventDefault();ev.stopPropagation();deleteIncome(rec.id,btn)};entry.appendChild(btn)})})}
app.addEventListener('load',()=>{installCustomTechInput();installCustomPaymentNames();addDeleteButtons();try{const doc=app.contentDocument||app.contentWindow.document;const observer=new MutationObserver(()=>{installCustomTechInput();installCustomPaymentNames();addDeleteButtons()});observer.observe(doc.documentElement,{childList:true,subtree:true});setTimeout(()=>{installCustomTechInput();installCustomPaymentNames();addDeleteButtons()},300);setTimeout(()=>{installCustomTechInput();installCustomPaymentNames();addDeleteButtons()},1000)}catch(e){}});
</script>
</body>
</html>
