<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soulcool Nails Mac</title><style>html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}iframe{width:100%;height:100%;border:0}.mac-nav{position:fixed;right:22px;bottom:22px;z-index:9999;display:flex;gap:10px;background:rgba(255,255,255,.96);padding:10px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.18)}button{border:0;border-radius:11px;padding:12px 16px;font-weight:800;font-size:14px;cursor:pointer;background:#111;color:#fff}button:hover{opacity:.82}.hint{position:fixed;right:22px;bottom:82px;z-index:9999;background:#fff;padding:7px 10px;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.12);font-size:12px;color:#555}</style></head><body><iframe id="app" src="daily-swipe.html?v=20260812-mac2"></iframe><div class="hint">每日明細：可用按鈕切換日期</div><div class="mac-nav"><button onclick="move(-1)">← 上一天</button><button onclick="move(1)">下一天 →</button></div><script>function move(dir){const f=document.getElementById('app');try{const d=f.contentDocument||f.contentWindow.document;const s=d.getElementById('dailyDetailSlider');if(!s)return alert('請先往下找到「每日明細」');const card=s.querySelector('.day-card');const step=card?card.getBoundingClientRect().width+12:600;s.scrollBy({left:dir*step,behavior:'smooth'});s.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){alert('請重新整理後再試一次');}}</script></body></html>
