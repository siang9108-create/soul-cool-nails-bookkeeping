<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">
<title>Soulcool Nails 雲端記帳</title>
<style>html,body{margin:0;width:100%;height:100%;background:#f7f5f2}#app{border:0;width:100%;height:100vh;display:block}</style>
</head>
<body>
<iframe id="app" src="soulcool_nails_FINAL_fixed_index.html?v=20260824-tipmode1"></iframe>
<script>
const app=document.getElementById('app');
function getDoc(){try{return app.contentDocument||app.contentWindow.document}catch(e){return null}}
function installFixedTechNames(){
  const doc=getDoc();if(!doc)return;const w=app.contentWindow;
  const picker=doc.querySelector('#iTech');if(!picker||picker.dataset.fixedNames==='1')return;
  picker.dataset.fixedNames='1';
  const names=['Kimi','Zoey','Cherries','Cici','Tina','Eva','Betty','Raina'];
  picker.innerHTML=names.map(name=>`<label class="tech-choice"><input type="checkbox" value="${name}">${name}</label>`).join('');
  picker.querySelectorAll('input[type="checkbox"]').forEach(cb=>cb.addEventListener('change',()=>{if(typeof w.refreshTechSplit==='function')w.refreshTechSplit()}));
}
function installEditablePaymentNames(){
  const doc=getDoc();if(!doc)return;const w=app.contentWindow;
  const p1=doc.getElementById('pKimi'),p2=doc.getElementById('pSiang');if(!p1||!p2)return;
  function makeEditable(input,id,placeholder){const box=input.parentElement;if(!box)return;let nameInput=doc.getElementById(id);if(!nameInput){const label=box.querySelector('label');if(!label)return;box.dataset.editablePay='1';label.innerHTML=`<input id="${id}" type="text" autocomplete="off" placeholder="${placeholder}" style="padding:6px 8px;font-size:13px">`;nameInput=doc.getElementById(id)}return nameInput}
  const n1=makeEditable(p1,'customPayName1','付款名稱 1'),n2=makeEditable(p2,'customPayName2','付款名稱 2');if(!n1||!n2)return;
  const KEY1='soulcool_custom_pay_name_1',KEY2='soulcool_custom_pay_name_2';
  if(!n1.dataset.bound){
    n1.value=localStorage.getItem(KEY1)||n1.value||'';
    n2.value=localStorage.getItem(KEY2)||n2.value||'';
    const changed=()=>{localStorage.setItem(KEY1,n1.value.trim());localStorage.setItem(KEY2,n2.value.trim());if(typeof w.render==='function')w.render()};
    n1.addEventListener('input',changed);n1.addEventListener('change',changed);n2.addEventListener('input',changed);n2.addEventListener('change',changed);
    n1.dataset.bound=n2.dataset.bound='1';
  }
  const payName1=()=>n1.value.trim()||'Kimi';
  const payName2=()=>n2.value.trim()||'Siang';
  const parseRawPay=x=>{const out={};const s=String((x&&x.pay)||'');if(s.includes(':'))s.split('|').forEach(part=>{const i=part.lastIndexOf(':');if(i>0){const k=part.slice(0,i),v=Number(part.slice(i+1)||0);out[k]=(out[k]||0)+v}});else if(s)out[s]=(out[s]||0)+Number((x&&x.paidTotal)||((x&&x.amount)||0)+((x&&x.tips)||0));return out};
  const updatePaymentLabels=()=>{const a=doc.getElementById('dKimi'),b=doc.getElementById('dSiang');if(a){const s=a.parentElement&&a.parentElement.querySelector('small');if(s)s.textContent=payName1()}if(b){const s=b.parentElement&&b.parentElement.querySelector('small');if(s)s.textContent=payName2()}const rows=doc.querySelectorAll('#payRows tr');if(rows[4]&&rows[4].cells[0])rows[4].cells[0].textContent=payName1();if(rows[5]&&rows[5].cells[0])rows[5].cells[0].textContent=payName2();if(payName1()===payName2()&&rows[5])rows[5].style.display='none';else if(rows[5])rows[5].style.display=''};
  if(!w.__customPaymentAccountingFixed){const oldRender=w.render;w.paymentParts=function(){const out={Zelle:Number(doc.getElementById('pZelle')?.value||0),Cash:Number(doc.getElementById('pCash')?.value||0),Card:Number(doc.getElementById('pCard')?.value||0),'Gift Card':Number(doc.getElementById('pGift')?.value||0)};const add=(k,v)=>{if(v>0)out[k]=(out[k]||0)+v};add('Kimi',Number(p1.value||0));add('Siang',Number(p2.value||0));return out};w.parsePay=function(x){const raw=parseRawPay(x);return {Zelle:Number(raw.Zelle||0),Cash:Number(raw.Cash||0),Card:Number(raw.Card||0),'Gift Card':Number(raw['Gift Card']||0),Kimi:Number(raw.Kimi||0),Siang:Number(raw.Siang||0)}};w.payLabel=function(x){const raw=parseRawPay(x),shown={};const add=(k,v)=>{v=Number(v||0);if(v>0)shown[k]=(shown[k]||0)+v};add('Zelle',raw.Zelle);add('Cash',raw.Cash);add('Card',raw.Card);add('Gift Card',raw['Gift Card']);add(payName1(),raw.Kimi);add(payName2(),raw.Siang);Object.entries(raw).forEach(([k,v])=>{if(!['Zelle','Cash','Card','Gift Card','Kimi','Siang'].includes(k))add(k,v)});return Object.entries(shown).map(([k,v])=>`${k} $${Number(v).toFixed(2)}`).join(' + ')||'-'};if(typeof oldRender==='function')w.render=function(){const r=oldRender.apply(this,arguments);updatePaymentLabels();return r};w.__customPaymentAccountingFixed=true}updatePaymentLabels();
}
function installSharedDiscount(){
  const doc=getDoc();if(!doc)return;const w=app.contentWindow;const rows=doc.getElementById('techSplitRows');if(!rows||w.__sharedDiscountInstalled)return;const original=w.refreshTechSplit;if(typeof original!=='function')return;
  const originalSplitTips=w.splitTips;
  const originalAddIncome=w.addIncome;
  function tipMode(){return doc.getElementById('tipAllocationMode')?.value||'auto'}
  function manualTips(){const out={};doc.querySelectorAll('.manual-tip-input').forEach(el=>out[el.dataset.tech]=Number(el.value||0));return out}
  w.splitTips=function(totalTips,parts){
    if(tipMode()!=='manual')return originalSplitTips(totalTips,parts);
    const tips=manualTips();
    return parts.map(p=>({...p,tip:Number(tips[p.tech]||0)}));
  };
  w.refreshTechSplit=function(){
    const names=typeof w.selectedTechs==='function'?w.selectedTechs():[];
    const box=doc.getElementById('techSplit');
    const oldGross={},oldManual=manualTips();
    doc.querySelectorAll('.tech-service-input').forEach(el=>oldGross[el.dataset.tech]=el.value);
    const oldDiscount=doc.getElementById('sharedTechDiscount')?.value||'';
    const oldMode=tipMode();
    if(!names.length){if(box)box.classList.remove('active');rows.innerHTML='';if(typeof w.refreshCalculations==='function')w.refreshCalculations();return}
    if(box)box.classList.add('active');
    rows.innerHTML=`<div style="margin-bottom:12px"><label style="display:block;font-weight:700;margin-bottom:6px">Tips 分配</label><select id="tipAllocationMode" style="width:100%;padding:10px;border-radius:10px"><option value="auto" ${oldMode==='auto'?'selected':''}>自動比例</option><option value="manual" ${oldMode==='manual'?'selected':''}>手動輸入</option></select></div>`+
      names.map(name=>`<div class="split-row"><b>${name}</b><input class="tech-service-input" data-tech="${name}" type="number" placeholder="服務金額" value="${oldGross[name]||''}"><span class="split-net" data-net-for="${name}"></span><span class="split-tip auto-tip-display" data-tip-for="${name}" style="${oldMode==='manual'?'display:none':''}"></span><input class="manual-tip-input" data-tech="${name}" type="number" min="0" step="0.01" placeholder="Tips" value="${oldManual[name]??''}" style="${oldMode==='manual'?'':'display:none'}"></div>`).join('')+
      `<div style="margin-top:12px"><label style="display:block;font-weight:700;margin-bottom:6px">折扣</label><input id="sharedTechDiscount" type="number" step="0.01" placeholder="折扣" value="${oldDiscount}" style="width:100%"></div>`;
    const mode=doc.getElementById('tipAllocationMode');
    if(mode)mode.onchange=()=>{const manual=mode.value==='manual';doc.querySelectorAll('.manual-tip-input').forEach(el=>el.style.display=manual?'':'none');doc.querySelectorAll('.auto-tip-display').forEach(el=>el.style.display=manual?'none':'');if(typeof w.refreshCalculations==='function')w.refreshCalculations()};
    doc.querySelectorAll('.tech-service-input,#sharedTechDiscount,.manual-tip-input').forEach(el=>el.oninput=()=>{if(typeof w.refreshCalculations==='function')w.refreshCalculations()});
    if(typeof w.refreshCalculations==='function')w.refreshCalculations();
  };
  w.currentParts=function(){const parts=[...doc.querySelectorAll('.tech-service-input')].map(el=>({tech:el.dataset.tech,gross:Number(el.value||0),discount:0,amount:Number(el.value||0)}));const discount=Math.max(0,Number(doc.getElementById('sharedTechDiscount')?.value||0));if(parts.length&&discount>0){const total=parts.reduce((s,p)=>s+p.gross,0);let used=0;parts.forEach((p,i)=>{const d=i===parts.length-1?Math.min(p.gross,discount-used):(total>0?Math.min(p.gross,discount*p.gross/total):0);p.discount=d;p.amount=Math.max(0,p.gross-d);used+=d})}return parts};
  w.addIncome=function(){
    if(tipMode()==='manual'){
      const parts=w.currentParts();
      const gross=parts.reduce((s,p)=>s+Number(p.gross||0),0);
      const paid=typeof w.paymentTotal==='function'?Number(w.paymentTotal()||0):0;
      const expected=Math.max(0,Math.round(paid-gross));
      const entered=Object.values(manualTips()).reduce((s,v)=>s+Number(v||0),0);
      if(Math.abs(entered-expected)>0.001)return alert('手動 Tips 合計必須等於總 Tips $'+expected.toFixed(2));
    }
    return originalAddIncome.apply(w,arguments);
  };
  w.__sharedDiscountInstalled=true;
}
function installAll(){installFixedTechNames();installEditablePaymentNames();installSharedDiscount()}
app.addEventListener('load',installAll);setTimeout(installAll,100);setTimeout(installAll,500);setTimeout(installAll,1200);setInterval(installAll,2000);
</script>
</body>
</html>
